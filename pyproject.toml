[project]
name = "openconstraint-mcp"
version = "0.2.0"
description = "Local-first MCP server for MiniZinc constraint solving"
readme = "README.md"
authors = [
    { name = "Openconstraint", email = "166951411+KeLiu99@users.noreply.github.com" }
]
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["constraint-programming", "mcp", "minizinc", "optimization", "solver"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "anyio>=4.5",
    "httpx>=0.28.1",
    "mcp[cli]>=2,<3",
    "mcp-types>=2,<3",
    "openpyxl>=3.1",
    "ortools>=9.10",
    "packaging>=26.2",
    "platformdirs>=4.10.0",
    "psutil>=7.2.2",
    "pydantic>=2.13.4",
    "rich>=15.0.0",
    "typer>=0.26.6",
]

[project.scripts]
openconstraint-mcp = "openconstraint_mcp:main"

[project.urls]
Homepage = "https://github.com/Openconstraint/openconstraint-mcp"
Repository = "https://github.com/Openconstraint/openconstraint-mcp"
Issues = "https://github.com/Openconstraint/openconstraint-mcp/issues"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "coverage>=7.15.2",
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.15",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not integration'"
markers = [
    "integration: exercises real subprocesses, platform-specific behavior, or a managed MiniZinc runtime (excluded from `just check`; run with `just integration`)",
]
filterwarnings = [
    # SEP-2577 deprecated the logging capability with no replacement for
    # server-initiated status push. `_report_status` keeps `ctx.info` on purpose
    # (see its docstring); the SDK warns from three rungs of that one call, which
    # is 27 identical entries in the `just check` summary. Silenced for the gate
    # ONLY — the runtime warning an operator sees on stderr is untouched, and the
    # filter is pinned to this exact message so a new deprecation still surfaces.
    "ignore:The logging capability is deprecated:mcp.shared.exceptions.MCPDeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
# Not implied by `strict`; closes the one gap `strict` leaves for a
# module-level `x = None` with no annotation.
disallow_untyped_globals = true
ignore_missing_imports = true
# `examples/` holds standalone scripts, not a package, so several basenames repeat
# across its directories (three `checker.py`, three `model.py`). Without this mypy
# aborts on "Duplicate module named"; with it each file is keyed by its full path.
explicit_package_bases = true
# Off by default in mypy; without it a typeshed `@deprecated` overload (e.g. the
# `@contextmanager` + `-> Iterator[T]` form) is silently accepted.
enable_error_code = ["deprecated"]
